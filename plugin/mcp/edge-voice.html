<!doctype html>
<html><head><meta charset="utf-8"><title>Claude voice (Edge)</title></head>
<body style="font:12px sans-serif;background:#222;color:#aaa">
<div id="st">starting</div>
<script>
// Browser speech engine for the Claude TTS server.
// Microsoft broke third-party access to its free online voices on 10.10.2026, but
// the Edge browser itself still speaks them. The server opens this page in a hidden
// Edge window; the page long-polls /edge/next for jobs and speaks them with
// speechSynthesis using "Microsoft Светлана/Дмитрий Online (Natural)".
//
// The page keeps its own queue and gives speechSynthesis one piece at a time, so a
// piece that breaks off early (engine error, or "ended" far too fast for its length)
// can be re-read from the last spoken word BEFORE the next piece starts. Each such
// case is reported to the server (/edge/report -> "edge cut" in speak.log).
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const queue = [];                 // { text, job, retried }
let cur = null, paused = false, voicesReady = false, cutNext = false;
const st = (s) => { document.getElementById('st').textContent = s; };
const pendingCount = () => queue.length + (cur ? 1 : 0);

function voices() { return speechSynthesis.getVoices(); }
function pickVoice(key) {
  const re = key === 'dmitry' ? /Dmitry|Дмитрий/i : /Svetlana|Светлана/i;
  const vs = voices();
  return vs.find((v) => re.test(v.name) && !v.localService) || vs.find((v) => re.test(v.name)) || null;
}
// Split long text into sentence chunks (safer for long replies).
function chunks(text) {
  const parts = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]*\s*/g) || [String(text)];
  const out = []; let cur = '';
  for (const p of parts) {
    if ((cur + p).length > 280 && cur) { out.push(cur.trim()); cur = ''; }
    cur += p;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function report(why, sec, len, rest) {
  fetch(`/edge/report?why=${encodeURIComponent(why)}&sec=${sec}&len=${len}&rest=${rest}`, { cache: 'no-store' }).catch(() => {});
}
function next() {
  if (cur || paused || !queue.length) return;
  const item = queue.shift();
  cur = item;
  const job = item.job;
  // Test of the watchdog fallback: simulate a hung Dmitry (counts as speaking, no sound).
  if (window.__silentDmitry && job.voice === 'dmitry') return;
  const u = new SpeechSynthesisUtterance(item.text);
  const v = pickVoice(job.voice);
  if (v) u.voice = v;
  u.lang = 'ru-RU';
  u.rate = job.rate || 1;
  u.volume = job.volume == null ? 1 : job.volume;
  let t0 = performance.now(), lastIdx = 0;
  u.onstart = () => { t0 = performance.now(); };
  u.onboundary = (e) => { if (e.charIndex > lastIdx) { lastIdx = e.charIndex; item.lastIdx = lastIdx; } };
  const finish = (err) => {
    if (cur !== item) return;          // stopped meanwhile
    cur = null;
    const sec = (performance.now() - t0) / 1000;
    const len = item.text.length;
    // Normal speech is ~15 chars/s; "ended" at more than 40 chars/s means it broke off.
    const tooFast = !err && len >= 80 && sec < len / (40 * (job.rate || 1)) && lastIdx < len * 0.9;
    const failed = err && err !== 'interrupted' && err !== 'canceled';
    const rest = item.text.slice(lastIdx).trim();
    if ((failed || tooFast || item.simCut) && !item.retried && rest.length > 3) {
      report(item.simCut ? 'test' : failed ? 'error ' + err : 'ended too early', sec.toFixed(1), len, rest.length);
      queue.unshift({ text: rest, job, retried: true });
    }
    setTimeout(next, 0);
  };
  u.onend = () => finish(null);
  u.onerror = (e) => finish(e.error || 'error');
  speechSynthesis.speak(u);
  if (cutNext) {
    cutNext = false;
    const arm = () => setTimeout(() => { if (cur === item) { item.simCut = true; speechSynthesis.cancel(); } }, 3000);
    const os = u.onstart; u.onstart = (e) => { os(e); arm(); };
  }
}
function enqueue(text, job) { queue.push({ text, job, retried: false }); }
function handle(job) {
  if (job.type === 'speak') {
    if (!job.queue && pendingCount() > 0) enqueue('Следующее сообщение.', job);
    for (const c of chunks(job.text)) enqueue(c, job);
    next();
  } else if (job.type === 'stop') {
    queue.length = 0; cur = null; paused = false; speechSynthesis.cancel();
  } else if (job.type === 'pause') {
    // No speechSynthesis.pause(): the online voices stream audio from Microsoft, and
    // during a long pause that stream times out - resume() then stays silent and only
    // a restart helped. Instead: stop the current piece, put the rest of it back at
    // the head of the queue from the word that was being spoken, and wait.
    paused = true;
    if (cur) {
      const item = cur; cur = null;
      const from = item.lastIdx || 0;
      const rest = item.text.slice(from).trim();
      if (rest) queue.unshift({ text: rest, job: item.job, retried: item.retried });
      speechSynthesis.cancel();
      report('pause', 0, item.text.length, rest.length);
    }
  } else if (job.type === 'resume') {
    paused = false;
    if (speechSynthesis.paused) speechSynthesis.resume();
    next();
  } else if (job.type === 'debug') {
    window.__silentDmitry = !!job.silentDmitry;
    if (job.cutNext) cutNext = true;
  } else if (job.type === 'reload') {
    location.reload();
  }
}
async function loop() {
  for (;;) {
    try {
      const busy = speechSynthesis.speaking || !!cur;
      const q = `speaking=${busy ? 1 : 0}&pending=${pendingCount()}&paused=${paused ? 1 : 0}&voices=${voicesReady ? 1 : 0}`;
      // A request that hangs must not stall the loop (the server then thinks the page
      // is dead and restarts the window, cutting speech mid-sentence).
      const ac = new AbortController();
      const to = setTimeout(() => ac.abort(), 5000);
      const r = await fetch('/edge/next?' + q, { cache: 'no-store', signal: ac.signal });
      const j = await r.json();
      clearTimeout(to);
      for (const job of j.jobs || []) handle(job);
      st(`ok ${new Date().toLocaleTimeString()} pending=${pendingCount()} speaking=${speechSynthesis.speaking}`);
    } catch (e) {
      st('server not reachable: ' + e.message);
      await sleep(500);
    }
  }
}
function waitVoices() {
  const t = setInterval(() => {
    if (voices().some((v) => /Светлана|Svetlana/i.test(v.name) && !v.localService)) { voicesReady = true; clearInterval(t); }
  }, 300);
}
waitVoices();
loop();
</script>
</body></html>
